etail)">編集</button> <button onclick="addMeal(detail)">献立に追加</button> <button onclick="if(confirm('ゴミ箱へ移動しますか？')){rec(detail).deleted=true;detail=null;update()}">削除</button></section>`}let list=s.recipes.filter(r=>!!r.deleted===trash&&(filter==='すべて'||filter==='お気に入り'&&r.favorite||filter===r.category||r.name.includes(filter)||r.ingredients.join(' ').includes(filter))&&[r.name,...r.ingredients,...r.seasonings].join(' ').includes(q));return `<h2>レシピ集</h2><input style="width:100%" placeholder="料理名・食材・味付けで検索" value="${esc(q)}" oninput="q=this.value;document.getElementById('results').innerHTML=rows()"><div class="chips" style="margin-top:10px">${['すべて','お気に入り','鶏むね','豚こま','鶏もも','卵','豆腐','副菜','魚料理','丼・ご飯もの'].map(x=>`<button class="${filter===x?'active':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><p><button onclick="editRecipe(null)">＋ 新規</button> <button onclick="trash=!trash;filter='すべて';render()">${trash?'一覧へ':'ゴミ箱'}</button></p><div id="results">${rows()}</div>`}function rows(){let a=s.recipes.filter(r=>!!r.deleted===trash&&(filter==='すべて'||filter==='お気に入り'&&r.favorite||filter===r.category||r.name.includes(filter)||r.ingredients.join(' ').includes(filter))&&[r.name,...r.ingredients,...r.seasonings].join(' ').includes(q));return `<small>${a.length}品</small>`+a.map(r=>`<article class="line"><div class="tile">🍽</div><div class="grow" onclick="detail='${r.id}';render()"><b>${esc(r.name)}</b><br><small>${esc(r.category)} ${r.cooked?' · 調理済み':''}</small></div><button onclick="${trash?`rec('${r.id}').deleted=false`:`rec('${r.id}').favorite=!rec('${r.id}').favorite`};update()">${trash?'復元':r.favorite?'♥':'♡'}</button></article>`).join('')}function editRecipe(id){let r=id?rec(id):{name:'',category:'主菜',ingredients:[],seasonings:[],steps:[]};$('app').innerHTML=`<h2>レシピ編集</h2><section><label>料理名<input id="rn" value="${esc(r.name)}"></label><label>分類<select id="rc">${['主菜','副菜','魚料理','丼・ご飯もの'].map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select></label>${[['ingredients','材料'],['seasonings','調味料'],['steps','作り方']].map(([k,n])=>`<label>${n}（1行ずつ）<textarea id="${k}">${esc(r[k].join('\n'))}</textarea></label>`).join('')}<button class="primary" onclick="commitRecipe('${id||''}')">保存</button> <button onclick="render()">取消</button></section>`}function commitRecipe(id){let name=$('rn').value.trim();if(!name)return alert('料理名を入力');let r=id?rec(id):{id:crypto.randomUUID(),favorite:false,cooked:false,memo:'',servings:1,status:'自作'};Object.assign(r,{name,category:$('rc').value});for(let k of ['ingredients','seasonings','steps'])r[k]=$(k).value.split('\n').filter(Boolean);if(!id)s.recipes.push(r);detail=r.id;update()}function newPlan(ids=[]){let p={id:crypto.randomUUID(),date:today(),items:ids.map(id=>({id,done:false})),checks:{},stock:{},prices:{},budget:s.weekly,inventory:s.inventory};s.plans.unshift(p);s.active=p.id;return p}function addMeal(id){if(rec(id).category==='副菜')return alert('副菜はレシピ集で管理します');let p=plan()||newPlan();p.items.push({id,done:false});delete p.shopping;delete p.estimatedCost;save();alert('献立に追加しました')}let mealQuery="";function startMeeting(ids=[]){mealQuery="";meeting=true;picks=ids.slice();if(ids.length)s.days=ids.length;mealDetail=null;render()}
function meals(){let p=plan();if(mealDetail){let r=rec(mealDetail);if(r)return `<button onclick="mealDetail=null;render()">← 今週の献立</button><section><h2>${esc(r.name)}</h2><h3>材料（1人分）</h3>${r.ingredients.map(esc).join('<br>')}<h3>調味料</h3>${r.seasonings.map(esc).join('<br>')}<h3>作り方</h3><ol>${r.steps.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><p>${esc(r.memo)}</p></section>`}return `<h2>献立</h2>${p?`<section><h3>今週のごはん</h3><small>${esc(p.date)} · 残り ${p.items.filter(x=>!x.done).length} / ${p.items.length}品</small><progress max="${p.items.length||1}" value="${p.items.filter(x=>x.done).length}"></progress>${p.items.map((x,i)=>`<div class="line mealrow"><input aria-label="調理済み" type="checkbox" ${x.done?'checked':''} onchange="plan().items[${i}].done=this.checked;update()"><button class="grow flat" onclick="mealDetail=plan().items[${i}].id;render()" style="${x.done?'text-decoration:line-through;color:#888':''}">${esc(rec(x.id)?.name||'削除済み')}　›</button></div>`).join('')}<button onclick="go(2)">買い物リストを見る</button></section>`:''}<button class="primary" onclick="${meeting?'meeting=false;render()':'startMeeting()'}">${meeting?'献立会議を閉じる':'＋ 新しい献立会議'}</button>${meeting?`<section><h3>献立会議</h3><label>日数 <input type="number" min="1" max="31" value="${s.days}" onchange="s.days=Math.max(1,Math.min(31,Math.floor(+this.value)||1));picks.length=Math.min(picks.length,s.days);update()"></label><label>予算 <input type="number" min="0" value="${s.weekly}" onchange="s.weekly=+this.value;save()"> 円</label><label>家にある食材<textarea oninput="s.inventory=this.value;save()">${esc(s.inventory)}</textarea></label><label>リクエスト<textarea oninput="s.request=this.value;save()">${esc(s.request)}</textarea></label><div class="chips"><button onclick="picks=Array(s.days).fill('@fav');render()">全部お気に入り</button><button onclick="picks=[];render()">全部ママにおまかせ</button></div><label>登録済みレシピを検索<input placeholder="料理名・食材" value="${esc(mealQuery)}" onchange="mealQuery=this.value;render()"></label>${Array.from({length:s.days},(_,i)=>`<label class="line"><small>${i+1}</small><select class="grow" style="min-width:0" onchange="picks[${i}]=this.value;render()"><option value="">ママにおまかせ</option><option value="@fav" ${picks[i]==='@fav'?'selected':''}>お気に入りから自動選択</option>${s.recipes.filter(r=>!r.deleted&&r.category!=='副菜'&&(!mealQuery||r.id===picks[i]||[r.name,...r.ingredients].join(' ').includes(mealQuery))).sort((a,b)=>Number(!!b.favorite)-Number(!!a.favorite)).map(r=>`<option value="${esc(r.id)}" ${picks[i]===r.id?'selected':''}>${r.favorite?'★ ':''}${esc(r.name)}</option>`).join('')}</select></label>`).join('')}<p>自分で選択 ${picks.filter(x=>x&&x!=="@fav").length}品 ／ お気に入り ${picks.filter(x=>x==='@fav').length}品 ／ おまかせ ${s.days-picks.filter(Boolean).length}品</p><button class="primary" onclick="copyRequest()">ママへの依頼文をコピー</button><h3>献立会議が終わったら</h3><textarea id="imp" placeholder="ママからのJSONを貼り付け"></textarea><button onclick="importPlan()">献立を確定する</button></section>`:''}<section><h3>献立履歴</h3>${s.plans.map((p,i)=>p.items.length?`<article><b>${esc(p.name||p.date+' 作成')}</b> ${p.id===s.active?'（今週）':''}<br><small>${esc(p.date)} · ${p.items.length}品 · ${p.estimatedCost==null?'概算なし':yen(p.estimatedCost)}</small><p>${p.items.slice(0,3).map(x=>esc(rec(x.id)?.name||'削除済み')).join('<br>')}${p.items.length>3?'<br>ほか'+(p.items.length-3)+'品':''}</p><button onclick="viewHistory(${i})">見る</button> <button onclick="startMeeting(s.plans[${i}].items.map(x=>x.id))">再利用</button> <button onclick="renameHistory(${i})">名前</button> <button onclick="deleteHistory(${i})">削除</button></article>`:'').join('')||'<small>まだありません</small>'}</section>`}
function viewHistory(i){let p=s.plans[i];$('app').innerHTML=`<button onclick="render()">← 献立へ</button><section><h3>${esc(p.name||p.date)}</h3>${p.items.map(x=>'<p>'+esc(rec(x.id)?.name||'削除済み')+'</p>').join('')}<button onclick="startMeeting(s.plans[${i}].items.map(x=>x.id))">再利用</button></section>`}function renameHistory(i){let n=prompt('献立の名前',s.plans[i].name||'');if(n!==null){s.plans[i].name=n.trim();update()}}function deleteHistory(i){if(s.plans[i].id===s.active)return alert('今週の献立は削除できません');if(confirm('この履歴を削除しますか？')){s.plans.splice(i,1);update()}}async function copyRequest(){let selected=picks.filter(Boolean).map(rec).filter(Boolean);let favCount=picks.filter(x=>x==='@fav').length;let favs=s.recipes.filter(r=>r.favorite&&!r.deleted&&r.category!=='副菜'&&!selected.some(x=>x.id===r.id));if(favCount>favs.length)return alert('お気に入りが不足しています。品数を調整してください。');let t=`まいにちごはんの献立会議。1人分、${s.days}日分、予算${s.weekly}円、曜日指定なし。在庫：${s.inventory}。希望：${s.request}。選択済みレシピ（原則維持、変更は相談）：${JSON.stringify(selected.map(({id,name,category,ingredients,seasonings,steps})=>({id,name,category,ingredients,seasonings,steps})))}。お気に入り候補：${JSON.stringify(favs.map(({id,name,category,ingredients,seasonings,steps})=>({id,name,category,ingredients,seasonings,steps})))}。候補から${favCount}品を在庫・予算・最近の献立（${JSON.stringify(s.plans.slice(0,3).map(p=>p.items.map(x=>x.id)))}）を考慮して重複なく選択。残り${s.days-selected.length-favCount}品は新規提案。予算超過や在庫の余り、調味料不足は先に相談。確定後のみJSONを出力。既存IDは維持、新規IDは重複しないもの。形式：{recipes:[{id,name,category,ingredients,seasonings,steps}],ids:[レシピID],shopping:[{name,unit,needed,stock,buy,purchaseLabel}],estimatedCost:円の数値,notes:文字列}。shoppingは全食材を集計し在庫を差し引き、購入不要も含める。常備調味料は除外、単位を揃え、概算は購入単位で計算。purchaseLabelには実際の購入目安（例：1本、6個入り1パック）を文字列で入れる。idsは必ず${s.days}件。`;try{await navigator.clipboard.writeText(t);alert('コピーしました')}catch(e){prompt('コピーしてください',t)}}
function importPlan(){try{let d=JSON.parse($('imp').value.trim().replace(/^```(?:json)?\s*|\s*```$/g,''));if(!Array.isArray(d.ids)||!Array.isArray(d.recipes)||d.ids.length!==s.days)throw Error('指定日数と献立数を確認');let rs=d.recipes.map(r=>{if(typeof r.id!=='string'||!r.name||!['ingredients','seasonings','steps'].every(k=>Array.isArray(r[k])&&r[k].every(x=>typeof x==='string')))throw Error('レシピ形式を確認');return {...r,favorite:false,cooked:false,memo:'',servings:1}});if(d.ids.some(id=>!rec(id)&&!rs.find(r=>r.id===id)))throw Error('レシピIDを確認');if(!Array.isArray(d.shopping)||!d.shopping.every(x=>typeof x.name==='string'&&typeof x.unit==='string'&&[x.needed,x.stock,x.buy].every(n=>typeof n==='number'&&Number.isFinite(n)&&n>=0)))throw Error('買い物データが不足しています');if(!confirm(d.ids.length+'品を確定しますか？'))return;for(let r of rs)if(!rec(r.id))s.recipes.push(r);let p=newPlan(d.ids);p.shopping=d.shopping.map(x=>({...x,buy:Math.max(0,x.needed-x.stock)}));p.estimatedCost=typeof d.estimatedCost==='number'&&d.estimatedCost>=0?d.estimatedCost:null;p.notes=String(d.notes||'');meeting=false;picks=[];update()}catch(e){alert(e.message||'JSON形式を確認してください')}}
function shopping(){let p=plan();if(!p)return '<h2>買い物</h2><section>献立を作ると買い物リストが表示されます。</section>';if(!p.shopping)return '<h2>買い物</h2><section>以前の献立です。在庫を正しく反映するため、献立履歴から再利用して献立会議を行ってください。<p><button onclick="go(1)">献立へ</button></p></section>';let fmt=(n,u)=>Math.round(n*100)/100+esc(u);return `<h2>買い物</h2><section><small>予算 ${yen(p.budget)}</small><h2>概算 ${p.estimatedCost==null?'未設定':yen(p.estimatedCost)}</h2>${p.estimatedCost>p.budget?'<p>予算オーバーの見込みです</p>':''}${p.estimatedCost==null?'':`<p>予算残額 <b>${yen(p.budget-p.estimatedCost)}</b></p><progress max="${p.budget||1}" value="${p.estimatedCost}"></progress>`}<details><summary>献立会議の補足・計算条件</summary><small>${esc(p.notes)}</small></details></section>${[['買い足すもの',x=>x.buy>0&&x.stock>0],['新しく買うもの',x=>x.buy>0&&x.stock===0],['家にあるもの（購入不要）',x=>x.buy===0]].map(([title,test])=>`<section><h3>${title}</h3>${p.shopping.map((x,i)=>test(x)?`<div class="line mealrow">${x.buy>0?`<input type="checkbox" ${p.checks[i]?'checked':''} onchange="plan().checks[${i}]=this.checked;update()">`:''}<div class="grow" style="${p.checks[i]?'text-decoration:line-through;color:#888':''}"><b>${esc(x.name)}</b><br><small>必要 ${fmt(x.needed,x.unit)} ／ 在庫 ${fmt(x.stock,x.unit)}</small></div><b>${x.buy>0?(x.purchaseLabel?esc(x.purchaseLabel):fmt(['本','個','袋','丁'].includes(x.unit)?Math.ceil(x.buy):x.buy,x.unit)):'不要'}</b></div>`:'').join('')||'<small>なし</small>'}</section>`).join('')}<button onclick="go(3)">実際の食費を記録</button>`}
function expenses(){let month=today().slice(0,7);let total=s.expenses.filter(x=>x.date.startsWith(month)).reduce((a,b)=>a+b.amount,0);return `<h2>食費</h2><section><small>${month} の支出</small><h1>${yen(total)}</h1><progress max="${s.budget||1}" value="${total}"></progress><p>残り ${yen(s.budget-total)}</p><label>月間予算 <input type="number" min="0" value="${s.budget}" onchange="s.budget=+this.value;update()"></label></section><section><h3>買い物記録</h3><input id="ed" type="date" value="${today()}"><input id="ea" type="number" min="0" placeholder="食費合計"><button onclick="addExpense()">登録</button>${s.expenses.map((x,i)=>`<p>${esc(x.date)}　${yen(x.amount)} <button onclick="if(confirm('削除しますか？')){s.expenses.splice(${i},1);update()}">×</button></p>`).join('')}</section><section><h3>バックアップ</h3><button onclick="backup()">全データを書き出す</button><label>復元<input type="file" accept=".json" onchange="restore(this.files[0])"></label><small>端末内保存。ブラウザデータを削除すると消える場合があります。</small></section>`}function addExpense(){let amount=+$('ea').value,date=$('ed').value;if(!date||amount<=0)return alert('日付と金額を確認');s.expenses.unshift({date,amount,plan:s.active});update()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json;charset=utf-8'}));a.download='mainichi-gohan-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){try{let d=JSON.parse(await f.text());if(!Array.isArray(d.recipes)||!Array.isArray(d.plans)||!Array.isArray(d.expenses)||!d.recipes.every(r=>r.id&&r.name&&['ingredients','seasonings','steps'].every(k=>Array.isArray(r[k]))))throw 0;if(confirm('現在のデータをバックアップで置き換えますか？')){s={...fresh(),...d};update()}}catch(e){alert('バックアップ形式を確認してください')}}render();</script></html>
